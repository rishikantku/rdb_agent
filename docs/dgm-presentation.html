<title>Ask the Bank</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;0,600;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  :root{
    --ground:#080D16; --panel:#101828; --panel-2:#162032; --line:#223049; --line-2:#2E3F5C;
    --ivory:#F2F6FB; --mute:#AEBCD0; --dim:#7B8CA6;
    --gold:#CBA765; --gold-weak:rgba(200,161,90,.12); --gold-line:rgba(200,161,90,.34);
    --steel:#6E8FE8; --steel-weak:rgba(110,143,232,.13);
    --ok:#3FB68B; --warn:#D99A45; --bad:#DE6A64;
    --serif:'Newsreader',Georgia,serif;
    --sans:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,sans-serif;
    --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:#05080E}
  body{font-family:var(--sans);color:var(--ivory);display:flex;align-items:center;justify-content:center}

  /* fixed 16:9 stage, scaled to the viewport so it never reads as a web page */
  #stage{width:1280px;height:720px;position:relative;transform-origin:center center}

  .slide{
    position:absolute;inset:0;padding:46px 60px 68px;
    background:
      radial-gradient(900px 420px at 88% -10%, rgba(200,161,90,.06), transparent 62%),
      var(--ground);
    display:none;flex-direction:column;
  }
  .slide.on{display:flex;animation:in .34s cubic-bezier(.16,1,.3,1)}
  @keyframes in{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}

  .eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin-bottom:11px}
  h1{font-family:var(--serif);font-size:58px;font-weight:500;letter-spacing:-.02em;line-height:1.08}
  h2{font-family:var(--serif);font-size:40px;font-weight:500;letter-spacing:-.015em;margin-bottom:6px}
    .sub{font-size:17px;color:var(--mute);max-width:82ch;line-height:1.6}
  .body{flex:1;display:flex;flex-direction:column;justify-content:center;gap:16px;min-height:0}
  .tight{justify-content:flex-start;padding-top:14px}

  /* chrome */
  .bar{position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--line)}
  .bar > i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#E0C384);transition:width .34s ease}
  .foot{position:absolute;left:64px;right:64px;bottom:22px;display:flex;align-items:center;justify-content:space-between;font-family:var(--mono);font-size:12px;letter-spacing:.13em;text-transform:uppercase;color:var(--dim)}

  /* primitives */
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 19px}
  .panel.gold{border-color:var(--gold-line);background:linear-gradient(180deg,var(--gold-weak),transparent)}
  .g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .g3{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}
  .g4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  .num{font-family:var(--mono);font-size:12.5px;color:var(--gold);letter-spacing:.1em;margin-bottom:7px}
  .h{font-size:17.5px;font-weight:700;margin-bottom:6px}
  .t{font-size:15px;color:var(--mute);line-height:1.6}
  .mono{font-family:var(--mono)}
  .kpi{font-family:var(--mono);font-size:36px;font-weight:500;color:var(--ivory)}
  .kpi small{font-size:16px;color:var(--mute)}

  /* vertical flow chain */
  .flow{display:flex;flex-direction:column;align-items:stretch;gap:0}
  .node{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:10px 15px;font-size:15px;display:flex;align-items:center;gap:10px}
  .node b{font-weight:600}
  .node .ex{margin-left:auto;font-family:var(--mono);font-size:12.5px;color:var(--dim)}
  .node.acc{border-color:var(--gold-line);background:var(--gold-weak)}
  .node.grd{border-color:rgba(63,182,139,.3);background:rgba(63,182,139,.08)}
  .arrow{height:13px;position:relative}
  .arrow::before{content:'';position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--line-2)}
  .arrow::after{content:'';position:absolute;left:50%;bottom:0;width:5px;height:5px;border-right:1px solid var(--line-2);border-bottom:1px solid var(--line-2);transform:translateX(-50%) rotate(45deg)}

  /* horizontal chain */
  .chain{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .chip{font-family:var(--mono);font-size:13px;padding:6px 11px;border:1px solid var(--line);border-radius:5px;color:var(--mute);white-space:nowrap;background:var(--panel)}
  .chip.acc{border-color:var(--gold-line);color:var(--gold);background:var(--gold-weak)}
  .chip.ok{border-color:rgba(63,182,139,.32);color:var(--ok);background:rgba(63,182,139,.08)}
  .chip.bad{border-color:rgba(222,106,100,.32);color:var(--bad);background:rgba(222,106,100,.08)}
  .sep{color:var(--dim);font-size:14px}

  /* architecture bands */
  .band{border:1px solid var(--line);border-radius:8px;padding:10px 14px;display:flex;align-items:center;gap:14px;background:var(--panel)}
  .band .lbl{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);width:132px;flex-shrink:0}
  .band .items{display:flex;gap:7px;flex-wrap:wrap}
  .band.guard{border-color:rgba(63,182,139,.34);background:linear-gradient(180deg,rgba(63,182,139,.08),transparent)}
  .band.guard .lbl{color:var(--ok)}

  /* table */
  table{width:100%;border-collapse:collapse;font-size:15px}
  th{text-align:left;font-family:var(--mono);font-size:11.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--dim);padding:8px 11px;border-bottom:1px solid var(--line-2)}
  td{padding:8px 11px;border-bottom:1px solid var(--line);color:var(--mute)}
  td:first-child{color:var(--ivory);font-weight:500}
  tr:last-child td{border-bottom:none}

  ul{list-style:none;display:flex;flex-direction:column;gap:6px}
  li{font-size:15px;color:var(--mute);display:flex;gap:10px;line-height:1.55}
  li::before{content:'';width:4px;height:4px;border-radius:50%;background:var(--gold);flex-shrink:0;margin-top:7px}
  li.y::before,li.n::before{display:none}
  li.y{color:var(--mute)} li.y b{color:var(--ok);font-family:var(--mono);font-size:14px}
  li.n b{color:var(--bad);font-family:var(--mono);font-size:14px}

  .note{font-size:13px;color:var(--dim);font-style:italic}
  .rule{height:1px;background:var(--line);margin:2px 0}
  .big{font-family:var(--serif);font-size:26px;line-height:1.4;color:var(--ivory)}
  .quote{font-family:var(--serif);font-size:23px;font-style:italic;color:var(--ivory);line-height:1.45}

  .poc{border-left:2px solid var(--warn);padding-left:11px}
  .prod{border-left:2px solid var(--ok);padding-left:11px}
  .tag{display:inline-block;font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding:2px 7px;border-radius:3px}
  .tag.poc{background:rgba(217,154,69,.14);color:var(--warn);border:1px solid rgba(217,154,69,.3);padding:2px 7px}
  .tag.prod{background:rgba(63,182,139,.12);color:var(--ok);border:1px solid rgba(63,182,139,.3);padding:2px 7px}

  /* navigation */
  /* Nexus lockup */
  .lockup{display:flex;align-items:center;gap:14px}
  .lockup .mark{width:46px;height:46px;flex-shrink:0}
  .lockup .wm{font-family:var(--serif);font-size:34px;font-weight:600;letter-spacing:.10em;color:var(--ivory);line-height:1}
  .lockup .desc{font-family:var(--mono);font-size:11px;letter-spacing:.19em;text-transform:uppercase;color:var(--dim);margin-top:5px}
  .tagline{font-family:var(--serif);font-style:italic;font-size:27px;color:var(--gold);line-height:1.3}

  /* brand plate — the wordmark is dark navy, so it needs a light ground */
  .p5plate{background:#F7F9FC;border-radius:10px;padding:13px 20px;display:inline-flex;align-items:center;border:1px solid rgba(255,255,255,.16);box-shadow:0 8px 26px -14px rgba(0,0,0,.8)}
  .p5plate img{display:block;height:46px;width:auto}
  .p5plate.lg img{height:62px}
  .powered{display:flex;align-items:center;gap:13px}
  .powered .lab{font-family:var(--mono);font-size:11px;letter-spacing:.17em;text-transform:uppercase;color:var(--dim)}
  .foot a{color:var(--dim);text-decoration:none;border-bottom:1px solid transparent}
  .foot a:hover{color:var(--gold);border-bottom-color:var(--gold-line)}
  #nav{position:fixed;right:26px;bottom:22px;display:flex;align-items:center;gap:10px;z-index:50}
  #nav button{
    font-family:var(--sans);font-size:14px;font-weight:600;color:var(--ivory);
    background:rgba(16,24,40,.92);border:1px solid var(--line-2);border-radius:8px;
    padding:10px 18px;cursor:pointer;backdrop-filter:blur(6px);
    transition:border-color .16s ease,color .16s ease,opacity .16s ease;
  }
  #nav button:hover:not(:disabled){border-color:var(--gold-line);color:var(--gold)}
  #nav button:disabled{opacity:.3;cursor:not-allowed}
  #nav .count{font-family:var(--mono);font-size:13px;color:var(--dim);letter-spacing:.09em;min-width:66px;text-align:center}
  #hint{position:fixed;bottom:26px;left:40px;transform:none;font-family:var(--mono);font-size:10px;color:#3B475C;letter-spacing:.1em;transition:opacity .5s}
</style>

<div id="stage"></div>
<div id="nav">
  <button id="prev" aria-label="Previous slide">&larr; Previous</button>
  <span class="count" id="count">01 / 27</span>
  <button id="next" aria-label="Next slide">Next &rarr;</button>
</div>

/* 3 */ add('02 — The Problem','Every question travels through a queue','Answers arrive days after the decision needed them.',`
  <div class="body">
    <div class="g2" style="align-items:start">
      <div>
        <div class="eyebrow" style="color:var(--dim)">Today</div>

          <div class="node">Manager needs information</div><div class="arrow"></div>
          <div class="node">Raises request with IT / MIS</div><div class="arrow"></div>
          <div class="node">Requirement clarification</div><div class="arrow"></div>
          <div class="node">SQL / report development</div><div class="arrow"></div>
          <div class="node">Validation &amp; report generation</div><div class="arrow"></div>
          <div class="node acc">Manager receives the answer</div>

          <li>Business users cannot explore data themselves</li>

/* 13 */ add('12 — SQL Governance','Generated SQL is treated as untrusted code','Nothing the model writes is executed on trust.',`
  <div class="body">

      <div class="flow">
        <div class="node acc">Generated SQL</div><div class="arrow"></div>
        <div class="node grd">SQL parser</div><div class="arrow"></div>
        <div class="node grd">Structural analysis</div><div class="arrow"></div>
        <div class="node grd">Object validation &mdash; known tables and columns only</div><div class="arrow"></div>
        <div class="node grd">Permission check</div><div class="arrow"></div>
        <div class="node grd">Read-only check</div><div class="arrow"></div>
        <div class="node grd">Complexity and cost check</div><div class="arrow"></div>
        <div class="node grd">Result limit applied</div><div class="arrow"></div>
        <div class="node">Execute</div>
      </div>
      <div style="display:flex;flex-direction:column;gap:11px">
        <div class="panel"><div class="h">Refused outright</div>
          <div class="chain" style="margin-top:9px">
            <span class="chip bad">INSERT</span><span class="chip bad">UPDATE</span><span class="chip bad">DELETE</span><span class="chip bad">DROP</span><span class="chip bad">ALTER</span><span class="chip bad">TRUNCATE</span><span class="chip bad">CREATE</span><span class="chip bad">GRANT</span><span class="chip bad">REVOKE</span><span class="chip bad">MERGE</span><span class="chip bad">EXECUTE</span><span class="chip bad">CALL</span>

          <li>Tables or columns outside the permitted set</li>

          <li>SQL injection through generated text</li>

/* ---------- render + navigation ---------- */
const stage = document.getElementById('stage');
stage.innerHTML = S.map((s, i) => `
  <section class="slide" data-i="${i}">
    ${s.title ? `<div class="eyebrow">${s.eyebrow}</div><h2>${s.title}</h2>${s.sub ? `<div class="sub">${s.sub}</div>` : ''}` : ''}
    ${s.body}
    <div class="foot"><span>Ask the Bank &middot; Confidential &nbsp;·&nbsp; Powered by <a href="https://p5digital.com/" target="_blank" rel="noopener">P5 Digital Solutions Private Limited</a></span></div>
    <div class="bar"><i style="width:${((i + 1) / S.length) * 100}%"></i></div>
  </section>`).join('');

let cur = 0;
const slides = [...document.querySelectorAll('.slide')];
const prevBtn = document.getElementById('prev');
const nextBtn = document.getElementById('next');
const countEl = document.getElementById('count');

const show = (n) => {
  cur = Math.max(0, Math.min(S.length - 1, n));
  slides.forEach((el, i) => el.classList.toggle('on', i === cur));
  prevBtn.disabled = cur === 0;
  nextBtn.disabled = cur === S.length - 1;
  countEl.textContent = `${String(cur + 1).padStart(2, '0')} / ${S.length}`;
  location.hash = cur + 1;
};

prevBtn.addEventListener('click', (e) => { e.stopPropagation(); show(cur - 1); });
nextBtn.addEventListener('click', (e) => { e.stopPropagation(); show(cur + 1); });

const fit = () => {
  const k = Math.min(window.innerWidth / 1280, window.innerHeight / 720);
  stage.style.transform = `scale(${k})`;
};
window.addEventListener('resize', fit);
fit();

addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') { e.preventDefault(); show(cur + 1); }
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); show(cur - 1); }
  else if (e.key === 'Home') show(0);
  else if (e.key === 'End') show(S.length - 1);
  else if (e.key.toLowerCase() === 'f') {
    document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(() => {});
  }
});
addEventListener('click', (e) => {
  if (e.target.closest('#nav') || e.target.closest('a')) return;
  show(cur + (e.clientX < window.innerWidth * 0.25 ? -1 : 1));
});

show(Math.max(0, (parseInt(location.hash.slice(1), 10) || 1) - 1));

</script>
